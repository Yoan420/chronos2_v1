version: 1

# Les composants décrivent les colonnes réellement envoyées à Chronos-2,
# après expansion des stratégies lag24 / lag168 / oracle.
components:
  base_calendar:
    description: Calendrier cyclique standard déjà présent dans Chronos-2 modulaire.
    patterns:
      - known_hour_*
      - known_dow_*
      - known_doy_*
      - known_is_weekend

  rich_calendar_fr_holidays:
    description: Jours fériés et effets adjacents propres à la France.
    patterns:
      - known_cal_holiday_fr_oracle
      - known_cal_bridge_day_fr_oracle
      - known_cal_day_before_holiday_fr_oracle
      - known_cal_day_after_holiday_fr_oracle
      - known_cal_is_business_day_fr_oracle

  rich_calendar_neighbour_holidays:
    description: Jours fériés des marchés voisins et agrégats de jours fériés.
    patterns:
      - known_cal_holiday_de_oracle
      - known_cal_holiday_be_oracle
      - known_cal_holiday_nl_oracle
      - known_cal_holiday_es_oracle
      - known_cal_holiday_count_oracle
      - known_cal_any_neighbour_holiday_oracle

  rich_calendar_intraday_blocks:
    description: Blocs horaires déterministes redondants potentiels avec l'heure.
    patterns:
      - known_cal_morning_peak_oracle
      - known_cal_evening_peak_oracle
      - known_cal_night_offpeak_oracle

  rich_calendar_period_ends:
    description: Fins de mois et de trimestre.
    patterns:
      - known_cal_month_end_oracle
      - known_cal_quarter_end_oracle

  rich_calendar_dst:
    description: Heure d'été et journée de transition DST.
    patterns:
      - known_cal_dst_oracle
      - known_cal_dst_transition_day_oracle

  fr_residual_load:
    description: Forecast PIT de charge résiduelle française.
    patterns:
      - '*fr_residual_load_fcst*'

  fr_nuclear_generation:
    description: Forecast PIT de génération nucléaire française.
    patterns:
      - '*fr_nuclear_generation_fcst*'

  cwe_residual_load:
    description: Charges résiduelles PIT Allemagne, Belgique et Pays-Bas.
    patterns:
      - '*de_residual_load_fcst*'
      - '*be_residual_load_fcst*'
      - '*nl_residual_load_fcst*'

  es_residual_load:
    description: Charge résiduelle PIT Espagne.
    patterns:
      - '*es_residual_load_fcst*'

  fr_net_exports:
    description: Exports nets français observés, utilisés avec retards.
    patterns:
      - '*fr_net_exports*'

  neighbour_prices_raw:
    description: Prix Day-Ahead bruts des quatre voisins.
    patterns:
      - '*de_price_da*'
      - '*be_price_da*'
      - '*nl_price_da*'
      - '*es_price_da*'

  neighbour_price_pair_spreads:
    description: Spreads FR moins prix de chaque voisin.
    patterns:
      - '*fr_de_price_spread*'
      - '*fr_be_price_spread*'
      - '*fr_nl_price_spread*'
      - '*fr_es_price_spread*'

  neighbour_price_level_aggregates:
    description: Niveau moyen, minimum et maximum des prix voisins.
    patterns:
      - '*neighbour_price_mean*'
      - '*neighbour_price_min*'
      - '*neighbour_price_max*'

  neighbour_price_dispersion:
    description: Dispersion transfrontalière des prix voisins.
    patterns:
      - '*neighbour_price_dispersion*'

  neighbour_spread_aggregates:
    description: Agrégats des spreads français face aux voisins.
    patterns:
      - '*fr_neighbour_spread_mean*'
      - '*fr_neighbour_spread_tightest*'
      - '*fr_neighbour_spread_widest*'

  uncertainty_fr_residual:
    description: Dispersion, dernière révision et âge du forecast résiduel FR.
    patterns:
      - '*fr_residual_load_revision_std*'
      - '*fr_residual_load_revision_abs_delta*'
      - '*fr_residual_load_revision_age_hours*'

  uncertainty_fr_nuclear:
    description: Dispersion et dernière révision du forecast nucléaire FR.
    patterns:
      - '*fr_nuclear_revision_std*'
      - '*fr_nuclear_revision_abs_delta*'

  uncertainty_neighbours:
    description: Agrégats d'incertitude des charges résiduelles voisines.
    patterns:
      - '*neighbour_residual_revision_std_mean*'
      - '*neighbour_residual_revision_std_max*'
      - '*neighbour_residual_revision_abs_delta_mean*'

  order_ramp_jump:
    description: Scores OOF de rampe et de rupture brusque.
    patterns:
      - '*fr_order_ramp_pressure_fcst*'
      - '*fr_order_jump_probability_fcst*'

  order_plateau_block_gradient:
    description: Scores OOF plateau, block order et contrainte de gradient.
    patterns:
      - '*fr_order_plateau_pressure_fcst*'
      - '*fr_order_block_pressure_fcst*'
      - '*fr_order_gradient_binding_probability_fcst*'

  market_regime:
    description: Variables de régime de marché calculées uniquement sur le passé.
    patterns:
      - '*market_regime*'
      - '*regime_level*'
      - '*regime_volatility*'
      - '*regime_negative*'
      - '*regime_spike*'
      - '*regime_trend*'

  interconnection_capacities:
    description: Capacités ou programmes d'interconnexion ajoutés ultérieurement.
    patterns:
      - '*interconnection*'
      - '*_ntc_*'
      - '*_atc_*'
      - '*capacity_import*'
      - '*capacity_export*'

families:
  calendar:
    description: Calendrier standard et calendrier enrichi.
    components:
      - base_calendar
      - rich_calendar_fr_holidays
      - rich_calendar_neighbour_holidays
      - rich_calendar_intraday_blocks
      - rich_calendar_period_ends
      - rich_calendar_dst

  fr_fundamentals:
    description: Fondamentaux directement liés à la France.
    components:
      - fr_residual_load
      - fr_nuclear_generation

  neighbour_fundamentals:
    description: Charges résiduelles des pays voisins.
    components:
      - cwe_residual_load
      - es_residual_load

  flows:
    description: Flux observés ou capacités d'interconnexion.
    components:
      - fr_net_exports
      - interconnection_capacities

  neighbour_market:
    description: Prix voisins, spreads et agrégats transfrontaliers.
    components:
      - neighbour_prices_raw
      - neighbour_price_pair_spreads
      - neighbour_price_level_aggregates
      - neighbour_price_dispersion
      - neighbour_spread_aggregates

  forecast_uncertainty:
    description: Variables de révision point-in-time.
    components:
      - uncertainty_fr_residual
      - uncertainty_fr_nuclear
      - uncertainty_neighbours

  order_signals:
    description: Signaux auxiliaires OOF de structure de courbe.
    components:
      - order_ramp_jump
      - order_plateau_block_gradient

  regime:
    description: Régime de marché historique.
    components:
      - market_regime
