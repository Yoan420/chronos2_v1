# Pipeline horaire France : Chronos-2 + LEAR + CatBoost + ensemble OOF.
#
# Le modèle reste horaire. Une éventuelle cible 15 minutes doit être agrégée
# par moyenne arithmétique des quatre MTU avant l'entraînement. Les jours de
# livraison Europe/Paris produisent automatiquement 23, 24 ou 25 lignes.

model:
  model_id: amazon/chronos-2
  device: auto
  local_files_only: true
  attn_implementation: auto
  context_length: 2048
  # Valeur nominale seulement : le runner horaire remplace cet horizon par
  # la longueur physique du jour de livraison (23/24/25).
  horizon: 24
  origin_batch_size: 12
  model_batch_size: 128
  seed: 42

data:
  project_root: .
  source: auto
  cache_dir: data/cache
  saturn_url: https://saturn-energyscan.gem.myengie.com//api
  saturn_author: BQ6757
  historical_years: 4
  frequency: h

  # Contrat de cible : aucune interpolation d'une heure manquante.
  target_input_resolution: hourly   # hourly | quarter_hour
  quarter_hour_incomplete: raise    # raise | nan | drop
  target_interpolation_limit: 0
  dynamic_delivery_day_horizon: true

  # Le run échoue si une covariable requise ou son horizon futur manque.
  default_fill_limit: 0
  require_all_covariates: true
  fail_below_minimum_coverage: true
  require_complete_future_covariates: true
  minimum_future_coverage: 1.0

  # Cutoff opérationnel avant l'enchère SDAC.
  forecast_origin_local_time: "08:00"
  revision_policy: latest_before_asof
  target_end_policy: current_day_end
  require_complete_target_day: true
  pit_vintage_dir: data/pit/vintages
  pit_files:
    fr_residual_load_fcst: fr_residual_load_fcst.parquet
    fr_nuclear_generation_fcst: fr_nuclear_generation_fcst.parquet
    de_residual_load_fcst: de_residual_load_fcst.parquet
    be_residual_load_fcst: be_residual_load_fcst.parquet
    nl_residual_load_fcst: nl_residual_load_fcst.parquet
    es_residual_load_fcst: es_residual_load_fcst.parquet

backtest:
  # 365 jours OOF pour apprendre les poids, suivis d'un holdout de 365 jours.
  windows: 730
  origin_hour: 0
  skip_irregular_local_days: false

hourly:
  feature_engineering:
    target_lags: [24, 48, 168, 336]
    target_rolling_windows: [24, 72, 168]
    timezone: Europe/Paris

  oof:
    n_splits: 5
    min_train_days: 730
    gap_days: 1
    evaluation_days: 365
    ensemble_minimum_rows: 720

  lear:
    alpha: 0.02
    l1_ratio: 0.8
    min_samples_per_hour: 60
    max_iter: 10000

  catboost:
    backend: catboost
    iterations: 500
    depth: 7
    learning_rate: 0.035
    l2_leaf_reg: 6.0
    # Le modèle global inclut l'heure locale comme feature. Mettre 120 pour
    # entraîner en plus un jeu de modèles spécialisés par heure.
    min_samples_per_hour: 1000000
    thread_count: -1

  ensemble:
    minimum_rows: 720
    weight_l2: 0.000001
    calibration_window_hours: 672
    calibration_min_periods: 48

  supply_stack:
    # Activer après avoir ajouté les 15 alias PIT standardisés ci-dessous aux
    # covariables FR. Le mode strict bloque tout input manquant.
    enabled: false
    nan_policy: raise
    rolling_windows: [3, 6, 24]
    columns:
      load_forecast: load_forecast
      wind_forecast: wind_forecast
      solar_forecast: solar_forecast
      nuclear_available: nuclear_available
      thermal_available: thermal_available
      hydro_firm: hydro_firm
      import_headroom: import_headroom
      export_headroom: export_headroom
      pumping_capacity: pumping_capacity
      nuclear_minimum: nuclear_minimum
      run_of_river: run_of_river
      ttf_eur_mwh_th: ttf_eur_mwh_th
      eua_eur_tco2: eua_eur_tco2
      api2_usd_tonne: api2_usd_tonne
      eurusd_usd_per_eur: eurusd_usd_per_eur
      coal_eur_mwh_th: null

output:
  directory: runs/chronos2_hourly_fr

zones:
  FR:
    enabled: true
    timezone: Europe/Paris
    include_calendar: true
    target:
      # Série canonique UTC, continue et sans doublon : elle restitue bien
      # 23/24/25 produits physiques lors des changements d'heure français.
      series: power.price.da.fr.bzn.hourly.entsoe.utc.cdh.eurmwh
      naive_timezone: UTC
      description: Prix Day-Ahead France horaire ENTSO-E (timeline UTC)

    covariates:
      fr_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.fr.residual.load.hourly.gw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      fr_nuclear_generation_fcst:
        # Désactivé : l'historique PIT disponible est trop court pour le
        # backtest de quatre ans et échoue au seuil de couverture.
        enabled: false
        source: pit_parquet
        series: power.fr.generation.nuclear.remit.mw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      fr_nuclear_generation_obs:
        # La source est en heure civile française. Saturn omet le second fold
        # 02:00 à l'automne ; la politique explicite ci-dessous le duplique
        # uniquement pour cette covariable lente, jamais pour la cible prix.
        # Le retard de publication observé ne permet pas de couvrir les
        # 24 heures de J+1 avec lag72. lag96 est un décalage physique fixe
        # sur la grille UTC continue ; aucun fallback plus court n'est permis.
        enabled: true
        source: auto
        series: power.fr.generation.nuclear.entsoe.hourly.gw.obs
        naive_timezone: Europe/Paris
        incomplete_dst_policy: duplicate
        include_base_context: false
        fill_method: ffill
        fill_limit: 2
        minimum_coverage: 0.90
        future: {known_future: false, strategies: [lag96]}

      de_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.de.residual.load.hourly.gw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      be_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.be.residual.load.hourly.gw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      nl_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.nl.residual.load.hourly.gw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      es_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.es.residual.load.hourly.gw.fcst
        fill_method: none
        minimum_coverage: 0.50
        future: {known_future: true, strategies: [oracle]}

      # Le proxy lag96 couvre le jour futur malgré le retard de publication
      # constaté dans Saturn. La série brute n'entre pas dans le contexte et
      # aucun lag24/lag48/lag72 ni fallback silencieux n'est construit.
      fr_net_exports:
        enabled: true
        source: auto
        series: power.net.fr.exports.core.entsoe.hourly.gw.obs
        # N'agit que sur un 02:00 local singleton ; une vraie paire DST ou
        # une timeline UTC continue est conservée sans duplication.
        incomplete_dst_policy: duplicate
        include_base_context: false
        fill_method: ffill
        fill_limit: 2
        minimum_coverage: 0.90
        future: {known_future: false, strategies: [lag96]}
