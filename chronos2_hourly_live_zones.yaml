schema_version: 1

# A zone is executable only when both flags are true and every local artefact
# passes chronos2_hourly.zone_live.audit_zone_live_bundle.  Empty series are
# deliberate blockers, never invitations to reuse the French series.
zones:
  FR:
    enabled: true
    production_ready: true
    training_candidate_ready: true
    training_config: chronos2_hourly_fr_residual_v1.yaml
    delivery_timezone: Europe/Paris
    forecast_origin_timezone: Europe/Paris
    forecast_origin_local_time: 08:00
    bidding_zone: FR
    runner: run_mkonline_live_hourly.py
    live_config: chronos2_hourly_fr_mkonline_live_v1.yaml
    target_series: power.price.da.fr.bzn.hourly.entsoe.utc.cdh.eurmwh
    target_status: audited_dst_strict
    price_unit: EUR/MWh
    primary_series: 41551_native
    primary_status: audited_primary
    prediction_mode: mkonline_blend
    mkonline_enabled: true
    storm_series: power.price.fr.euromwh.h.fcst.3mv.storm.da.cache
    storm_status: audited_day_ahead_cache
    storm_primary_series: power.price.fr.euromwh.h.fcst.3mv.storm.da.cache
    storm_naive_timezone: Europe/Paris
    storm_strict_08_series: power.price.fr.euromwh.h.fcst.3mv.storm.da.basecase
    storm_pit_path: data/pit/vintages/fr_price_storm_da_fcst.parquet
    required_covariates:
      - fr_residual_load_fcst
