# Chronos-2 — backtest point-in-time non biaisé et forecast J+1 complet

model:
  model_id: amazon/chronos-2
  device: auto
  local_files_only: true
  attn_implementation: auto
  context_length: 2048
  horizon: 24
  origin_batch_size: 20
  model_batch_size: 128
  seed: 42

data:
  project_root: .
  source: auto
  cache_dir: data/cache

  saturn_url: https://saturn-energyscan.gem.myengie.com//api
  saturn_author: BQ6757

  historical_years: 4
  frequency: h

  # Une heure de prix absente bloque le run : la cible et la MAE ne sont
  # jamais interpolées à partir d'heures voisines.
  target_interpolation_limit: 0
  default_fill_limit: 0
  require_all_covariates: true

  forecast_origin_local_time: "08:00"
  revision_policy: latest_before_asof
  target_end_policy: current_day_end
  require_complete_target_day: true

  pit_vintage_dir: data/pit/vintages

  # Seulement les véritables séries prévisionnelles point-in-time.
  pit_files:
    fr_residual_load_fcst: fr_residual_load_fcst.parquet
    fr_nuclear_generation_fcst: fr_nuclear_generation_fcst.parquet
    de_residual_load_fcst: de_residual_load_fcst.parquet
    be_residual_load_fcst: be_residual_load_fcst.parquet
    nl_residual_load_fcst: nl_residual_load_fcst.parquet
    es_residual_load_fcst: es_residual_load_fcst.parquet

backtest:
  windows: 365
  origin_hour: 0
  skip_irregular_local_days: true
  price_only_baseline: true

metrics:
  extreme_threshold: 150.0

output:
  directory: runs/chronos2_asof_jplus1_fr

report:
  filename: chronos2_asof_jplus1_fr.html
  title: Chronos-2 — backtest as-of et forecast J+1
  forecast_history_hours: 168

zones:
  FR:
    enabled: true
    timezone: Europe/Paris
    include_calendar: true

    target:
      # Série canonique UTC, complète sur les journées DST 23/25 heures.
      series: power.price.da.fr.bzn.hourly.entsoe.utc.cdh.eurmwh
      naive_timezone: UTC
      description: Prix Day-Ahead France ENTSO-E (timeline UTC)

    covariates:
      fr_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.fr.residual.load.hourly.gw.fcst
        description: Forecast de charge résiduelle France
        fill_method: none
        minimum_coverage: 0.50
        future:
          known_future: true
          strategies:
            - oracle

      fr_nuclear_generation_fcst:
        # Désactivé : l'historique PIT disponible ne couvre pas encore la
        # fenêtre complète du backtest.
        enabled: false
        source: pit_parquet
        series: power.fr.generation.nuclear.remit.mw.fcst
        description: Forecast REMIT de génération nucléaire France
        fill_method: none
        minimum_coverage: 0.00
        future:
          known_future: true
          strategies:
            - oracle

      fr_nuclear_generation_obs:
        enabled: true
        source: auto
        series: power.fr.generation.nuclear.entsoe.hourly.gw.obs
        description: Production nucléaire France observée, proxy causal 96 h
        naive_timezone: Europe/Paris
        # Duplique uniquement le 02:00 manquant au passage à l'heure d'hiver.
        # Cette réparation est réservée aux covariables, jamais à la cible.
        incomplete_dst_policy: duplicate
        include_base_context: false
        fill_method: ffill
        fill_limit: 2
        minimum_coverage: 0.90
        future:
          known_future: false
          strategies:
            # Décalage fixe de 96 heures physiques. lag72 ne couvre pas les
            # 24 produits avec le retard de publication Saturn constaté.
            - lag96

      de_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.de.residual.load.hourly.gw.fcst
        description: Forecast de charge résiduelle Allemagne
        fill_method: none
        minimum_coverage: 0.50
        future:
          known_future: true
          strategies:
            - oracle

      be_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.be.residual.load.hourly.gw.fcst
        description: Forecast de charge résiduelle Belgique
        fill_method: none
        minimum_coverage: 0.50
        future:
          known_future: true
          strategies:
            - oracle

      nl_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.nl.residual.load.hourly.gw.fcst
        description: Forecast de charge résiduelle Pays-Bas
        fill_method: none
        minimum_coverage: 0.50
        future:
          known_future: true
          strategies:
            - oracle

      es_residual_load_fcst:
        enabled: true
        source: pit_parquet
        series: power.es.residual.load.hourly.gw.fcst
        description: Forecast de charge résiduelle Espagne
        fill_method: none
        minimum_coverage: 0.50
        future:
          known_future: true
          strategies:
            - oracle

      fr_net_exports:
        # Proxy à 96 heures physiques disponible au cutoff. La série
        # observée n'entre jamais brute dans le contexte et aucun
        # lag24/lag48/lag72 n'est construit.
        enabled: true

        # Série observée chargée depuis Saturn/cache standard,
        # et non depuis les vintages point-in-time.
        source: auto
        series: power.net.fr.exports.core.entsoe.hourly.gw.obs
        # Répare seulement un 02:00 local singleton ; une vraie paire DST ou
        # une timeline UTC complète est conservée telle quelle.
        incomplete_dst_policy: duplicate

        # La série est en GW, conformément au nom Saturn.
        description: Exportations nettes de la France (GW)

        fill_method: ffill
        fill_limit: 2
        minimum_coverage: 0.90
        include_base_context: false

        # Les exports du jour à prévoir ne sont pas connus à 08:00.
        # Le proxy lag96 est explicite : aucun fallback silencieux vers un lag
        # plus court n'est autorisé si les observations récentes manquent.
        future:
          known_future: false
          strategies:
            - lag96
