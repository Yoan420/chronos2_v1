        minimum_coverage: 0.0
        include_base_context: true
        future:
          known_future: true
          strategies:
          - oracle
      milp_reserve_shadow_eur_mwh:
        enabled: true
        source: file
        file: data/derived/structural_market_features.csv.gz
        timestamp_col: timestamp
        value_col: milp_reserve_shadow_eur_mwh
        description: Valeur duale de la contrainte de réserve.
        fill_method: none
        minimum_coverage: 0.0
        include_base_context: true
        future:
          known_future: true
          strategies:
          - oracle
exogenous_extensions:
  enabled: true
  neighbour_price_sources:
    enabled: false
    output_dir: data/derived/neighbour_prices
    countries:
      DE:
        alias: de_price_da
        series: power.price.everyday.de.hourly.eurmwh
      BE:
        alias: be_price_da
        series: power.price.everyday.be.hourly.eurmwh
      NL:
        alias: nl_price_da
        series: power.price.everyday.nl.hourly.eurmwh
      ES:
        alias: es_price_da
        series: power.price.everyday.es.hourly.eurmwh
  neighbour_prices:
    enabled: false
    aliases:
      DE: de_price_da
      BE: be_price_da
      NL: nl_price_da
      ES: es_price_da
    include_aggregates: false
  rich_calendar:
    enabled: true
    primary_country: FR
    countries:
    - FR
    - DE
    - BE
    - NL
    - ES
  forecast_uncertainty:
    enabled: false
    max_revisions: 6
    metrics:
    - revision_std
    - revision_abs_delta
    - revision_age_hours
    sources:
      fr_residual_load_fcst:
        output_prefix: fr_residual_load
        metrics:
        - revision_std
        - revision_abs_delta
        - revision_age_hours
      fr_nuclear_generation_fcst:
        output_prefix: fr_nuclear
        metrics:
        - revision_std
        - revision_abs_delta
      de_residual_load_fcst:
        output_prefix: de_residual_load
      be_residual_load_fcst:
        output_prefix: be_residual_load
      nl_residual_load_fcst:
        output_prefix: nl_residual_load
      es_residual_load_fcst:
        output_prefix: es_residual_load
    aggregate_groups:
      neighbour_residual:
        sources:
        - de_residual_load_fcst
        - be_residual_load_fcst
        - nl_residual_load_fcst
        - es_residual_load_fcst
        metrics:
        - revision_std_mean
        - revision_std_max
        - revision_abs_delta_mean
  interconnection_capacities:
    enabled: false
  calendar_interactions:
    enabled: false
structural_model:
  enabled: true
  inputs:
    residual_load_gw:
      alias: fr_residual_load_fcst
      scale: 1.0
    nuclear_capacity_gw:
      alias: fr_nuclear_generation_fcst
      scale: 0.001
      default: 45.0
    fixed_net_exports_gw:
      alias: null
      scale: 1.0
      default: 0.0
    gas_price_eur_mwhth:
      alias: null
      scale: 1.0
      default: null
    coal_price_eur_mwhth:
      alias: null
      scale: 1.0
      default: null
    eua_price_eur_t:
      alias: null
      scale: 1.0
      default: null
  reserve_fraction: 0.08
  reserve_floor_gw: 2.0
  voll_eur_mwh: 3000.0
  spill_cost_eur_mwh: 5.0
  reserve_shortfall_cost_eur_mwh: 1000.0
  initial_online_fraction: 0.5
  solver:
    mip_rel_gap: 0.001
    time_limit_seconds: 30.0
    node_limit: null
    presolve: true
  technologies:
  - name: nuclear
    commitment: false
    n_units: 1
    unit_size_gw: 45.0
    min_output_fraction: 0.0
    fixed_variable_cost_eur_mwh: 10.0
    variable_om_eur_mwh: 0.0
    startup_cost_eur: 0.0
    no_load_cost_eur_h: 0.0
    ramp_up_gw_h_per_unit: 6.0
    ramp_down_gw_h_per_unit: 6.0
    availability_input: nuclear_capacity_gw
    availability_fallback_gw: 45.0
  - name: hydro
    commitment: false
    n_units: 1
    unit_size_gw: 11.0
    min_output_fraction: 0.0
    fixed_variable_cost_eur_mwh: 25.0
    variable_om_eur_mwh: 0.0
    startup_cost_eur: 0.0
    no_load_cost_eur_h: 0.0
    ramp_up_gw_h_per_unit: 5.0
    ramp_down_gw_h_per_unit: 5.0
    availability_fallback_gw: 11.0
    energy_budget_fraction: 0.45
  - name: coal
    commitment: true
    n_units: 4
    unit_size_gw: 0.6
    min_output_fraction: 0.4
    fixed_variable_cost_eur_mwh: 90.0
    variable_om_eur_mwh: 5.0
    startup_cost_eur: 35000.0
    no_load_cost_eur_h: 1400.0
    ramp_up_gw_h_per_unit: 0.25
    ramp_down_gw_h_per_unit: 0.25
    fuel_input: coal_price_eur_mwhth
    efficiency: 0.38
    emission_factor_t_mwh: 0.9
  - name: ccgt
    commitment: true
    n_units: 20
    unit_size_gw: 0.6
    min_output_fraction: 0.35
    fixed_variable_cost_eur_mwh: 95.0
    variable_om_eur_mwh: 3.0
    startup_cost_eur: 18000.0
    no_load_cost_eur_h: 700.0
    ramp_up_gw_h_per_unit: 0.4
    ramp_down_gw_h_per_unit: 0.4
    fuel_input: gas_price_eur_mwhth
    efficiency: 0.57
    emission_factor_t_mwh: 0.35
  - name: ocgt
    commitment: true
    n_units: 20
    unit_size_gw: 0.25
    min_output_fraction: 0.2
    fixed_variable_cost_eur_mwh: 150.0
    variable_om_eur_mwh: 5.0
    startup_cost_eur: 8000.0
    no_load_cost_eur_h: 250.0
    ramp_up_gw_h_per_unit: 0.25
    ramp_down_gw_h_per_unit: 0.25
    fuel_input: gas_price_eur_mwhth
    efficiency: 0.38
    emission_factor_t_mwh: 0.55
  - name: oil
    commitment: true
    n_units: 8
    unit_size_gw: 0.25
    min_output_fraction: 0.2
    fixed_variable_cost_eur_mwh: 230.0
    variable_om_eur_mwh: 8.0
    startup_cost_eur: 12000.0
    no_load_cost_eur_h: 350.0
    ramp_up_gw_h_per_unit: 0.25
    ramp_down_gw_h_per_unit: 0.25
    efficiency: 0.35
    emission_factor_t_mwh: 0.75
  output_file: data/derived/structural_market_features.csv.gz
  diagnostics_file: data/derived/structural_market_daily_diagnostics.csv
  residual_price_alias: milp_structural_price
  feature_aliases:
  - milp_structural_price
  - milp_marginal_technology_code
  - milp_reserve_margin_gw
  - milp_committed_thermal_gw
  - milp_online_units
  - milp_startups
  - milp_startup_cost_eur
  - milp_scarcity_gw
  - milp_ramp_shadow_eur_mwh
  - milp_reserve_shadow_eur_mwh
  residual_mode:
    enabled: true
  input_repair:
    impute_residual_load: true
    max_residual_load_missing_hours_per_day: 2
  alignment:
    enabled: true
    required_aliases:
    - milp_structural_price
    - milp_marginal_technology_code
    - milp_reserve_margin_gw
    - milp_committed_thermal_gw
    - milp_online_units
    - milp_startups
    - milp_startup_cost_eur
    - milp_scarcity_gw
    - milp_ramp_shadow_eur_mwh
    - milp_reserve_shadow_eur_mwh
