        description: Nombre agrégé d'unités thermiques en ligne.
        fill_method: none
        minimum_coverage: 0.0
        include_base_context: true
        future:
          known_future: true
          strategies:
          - oracle
      milp_startups:
        enabled: true
        source: file
        file: data/derived/structural_market_features.csv.gz
        timestamp_col: timestamp
        value_col: milp_startups
        description: Nombre agrégé de démarrages sur l'heure.
        fill_method: none
        minimum_coverage: 0.0
        include_base_context: true
        future:
          known_future: true
          strategies:
          - oracle
      milp_startup_cost_eur:
        enabled: true
        source: file
        file: data/derived/structural_market_features.csv.gz
        timestamp_col: timestamp
        value_col: milp_startup_cost_eur
        description: Coût de démarrage engagé sur l'heure en euros.
        fill_method: none
        minimum_coverage: 0.0
        include_base_context: true
