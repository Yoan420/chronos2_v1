# Fragment à fusionner dans chronos2_hourly_fr.yaml.
# Chaque fichier doit contenir : delivery_utc, availability_utc, revision_utc,
# value. availability_utc ET revision_utc doivent être <= cutoff D-1.

zones:
  FR:
    covariates:
      load_forecast:
        enabled: true
        source: pit_parquet
        pit_file: fr_load_forecast.parquet
        fill_method: none
        minimum_coverage: 0.98
        future: {known_future: true, strategies: [oracle]}

