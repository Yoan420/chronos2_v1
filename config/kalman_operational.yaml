version: 1

# Chaque refit journalier apprend exclusivement sur les 365 jours civils
# strictement anterieurs a l'origine de prevision. Cette valeur est auditee
# avant publication et aligne le Kalman standard sur les rapports FINAL365.
training_lookback_days: 365
rolling_refit_workers: 4

