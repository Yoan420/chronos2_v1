# Politique du filtre gouverne.  Ces valeurs reproduisent le comportement
# operationnel anterieur lorsque aucune nouvelle covariable n'est activee.
filter_parameters:
  q_over_r: 0.001
  scale_q_over_r: 0.0001
  innovation_clip_sigma: 3.0
  shift_clip_eur_mwh: 20.0
  governance_lookback_days: 60
  governance_minimum_days: 14
  governance_weight_step: 0.05
  minimum_gain_eur_mwh: 0.05
  minimum_relative_gain: 0.005
  scale_minimum: 0.5
  scale_maximum: 1.5
  ukf_scale_persistence: 0.99
  market_feature_clip: 5.0
  candidate_kinds:
    - linear_bias
    - linear_harmonic
    - linear_market
    - linear_scale
    - ukf_scale

# Les cinq forecasts de charge residuelle sont deja presents dans les archives
# scellees.  Les deux aggregats ne melangent donc que des series de meme unite.
covariates:
  input_columns:
    - fr_residual_load_fcst
    - de_residual_load_fcst
    - be_residual_load_fcst
    - nl_residual_load_fcst
    - es_residual_load_fcst
  derived:
    residual_load_mean:
      kind: mean
      sources:
        - fr_residual_load_fcst
        - de_residual_load_fcst
        - be_residual_load_fcst
        - nl_residual_load_fcst
        - es_residual_load_fcst
    residual_load_spread:
      kind: spread
      sources:
        - fr_residual_load_fcst
        - de_residual_load_fcst
        - be_residual_load_fcst
        - nl_residual_load_fcst
        - es_residual_load_fcst
  groups:
    market:
      - fr_residual_load_fcst
      - de_residual_load_fcst
      - be_residual_load_fcst
      - nl_residual_load_fcst
      - es_residual_load_fcst
      - residual_load_mean
      - residual_load_spread
    fundamentals:
      - fr_residual_load_fcst
      - de_residual_load_fcst
      - be_residual_load_fcst
      - nl_residual_load_fcst
      - es_residual_load_fcst
      - residual_load_mean
      - residual_load_spread
  history_missing_policy: neutral
  minimum_history_coverage: 0.0
  require_future_complete: true

# Exemple d'opt-in (laisse vide tant que les vintages PIT ne couvrent pas tout
# l'historique et J+1).  Direction de columns: alias_modele: colonne_du_fichier.
additional_sources: {}

provenance:
  purpose: governed_residual_kalman_operational_sidecar
  sealed_live_contract_modified: false
