schema_version: 1
registry_id: autonomous_exogenous_research_v1
purpose: >-
  Registre reproductible des signaux exogènes candidats pour les forecasts
  day-ahead autonomes FR, DE, BE, NL et ES. Ce fichier n'autorise ni fit ni
  écriture en production.

cutoff:
  timezone: Europe/Paris
  local_time: "08:00"
  delivery_horizon: day_ahead
  physical_actual_latest_day_offset: -2

policy:
  scope: offline_research_registry_only
  fail_closed: true
  training_allowed: false
  production_writes_allowed: false
  storm_mkonline_as_inputs: false
  latest_backfill_allowed: false
  interpolation_allowed: false
  forward_backward_fill_allowed: false
  raw_media_as_inputs: false
  direct_llm_price_output: false

families:
  - id: probabilistic_fundamentals
    title: Fondamentaux probabilistes
    priority: P0
    scientific_basis:
      - url: https://doi.org/10.1016/j.renene.2026.125844
        claim: >-
          Les distributions de charge, vent, solaire et charge résiduelle,
          notamment leurs quantiles extrêmes, peuvent améliorer la prévision
          de prix; les erreurs physiques de calibration s'arrêtent à D-2.
      - url: https://arxiv.org/abs/2501.06180
        claim: Manuscrit ouvert documentant la chronologie causale de calibration.
    signals:
      - id: residual_load_quantiles_pit
        title: Quantiles PIT de charge résiduelle
        zones: [FR, DE, BE, NL, ES]
        phase: A
        status: blocked
        operational_source:
          provider: Saturn
          dataset: point_forecasts_residual_load
          series_or_endpoint: zone_specific_series_to_freeze
        feature_contract:
          kind: probabilistic_numeric
          output_columns:
            - residual_load_q01
            - residual_load_q05
            - residual_load_q10
            - residual_load_q25
            - residual_load_q50
            - residual_load_q75
            - residual_load_q90
            - residual_load_q95
            - residual_load_q99
            - residual_load_dispersion
            - residual_load_skew
            - residual_load_ramp_risk
          numeric_only: true
          uses_physical_actuals: true
          physical_actual_latest_day_offset: -2
          same_day_uncleared_price_allowed: false
        gates:
          availability_d_minus_1_0800:
            status: blocked
            evidence_refs: []
            note: L'audit quotidien complet des cinq séries à 08:00 reste à sceller.
          point_in_time_vintages:
            status: blocked
            evidence_refs: []
            note: Les vintages et erreurs physiques D-2 doivent être matérialisés append-only.
          license_internal_research:
            status: blocked
            evidence_refs: []
            note: Le droit d'usage interne doit être documenté série par série.
          causal_lineage:
            status: passed
            evidence_refs: [contract:forecast_snapshot_and_revision_le_origin]
            note: Le contrat exclut les forecasts concurrents et limite les actuals à D-2.
          numeric_schema:
            status: passed
            evidence_refs: [contract:ordered_quantiles_and_finite_numeric_outputs]
            note: Le schéma attendu est numérique, fini et ordonné.
          zone_coverage:
            status: blocked
            evidence_refs: []
            note: La couverture horaire 365 jours n'est pas encore prouvée pour cinq zones.
        phase_gates: &all_phases_blocked
          A:
            status: blocked
            note: Matérialisation PIT et preuves opérationnelles incomplètes.
          B1:
            status: blocked
            note: Phase A non franchie.
          B2:
            status: blocked
            note: Recette B1 non gelée.
          FINAL:
            status: blocked
            note: Veto B2 non franchi.
          SHADOW:
            status: blocked
            note: Confirmation historique non franchie.
        blockers:
          - Disponibilité, vintages, licence et couverture restent à prouver.

      - id: residual_load_late_hour_coverage_repair
        title: Rematérialisation PIT des heures tardives de charge résiduelle
        zones: [FR, DE, BE, NL, ES]
        phase: A
        status: blocked
        operational_source:
          provider: Saturn
          dataset: exact_residual_load_revision_history
          series_or_endpoint: zone_specific_revision_history_as_of_origin
        feature_contract:
          kind: probabilistic_numeric
          output_columns:
            - residual_load_point_forecast_pit
            - residual_load_revision_age_hours
            - residual_load_source_coverage_flag
          numeric_only: true
          uses_physical_actuals: false
          physical_actual_latest_day_offset: null
          same_day_uncleared_price_allowed: false
        gates:
          availability_d_minus_1_0800:
            status: blocked
            evidence_refs: []
            note: >-
              L'audit local observe 543 à 545 heures manquantes sur 8760;
              l'existence de la révision exacte avant chaque origine 08:00
              doit être prouvée heure par heure.
          point_in_time_vintages:
            status: blocked
            evidence_refs: []
            note: >-
              Rematérialiser uniquement depuis le revision-history Saturn exact,
              comparer chaque valeur aux archives historiques et interdire
              interpolation, forward-fill, backward-fill et version latest.
          license_internal_research:
            status: blocked
            evidence_refs: []
            note: Le droit d'usage interne du revision-history doit être documenté.
          causal_lineage:
            status: passed
            evidence_refs: [contract:exact_revision_at_or_before_historical_origin_no_fill]
            note: >-
              La recette impose revision_timestamp <= origine historique et
              interdit toute reconstruction synthétique des heures absentes.
          numeric_schema:
            status: passed
            evidence_refs: [contract:finite_numeric_values_with_explicit_source_coverage]
            note: Valeurs et âge de révision numériques; couverture conservée pour l'audit.
          zone_coverage:
            status: blocked
            evidence_refs: []
            note: >-
              Les trous touchent presque toujours 22:00–23:00 locales sur
              348 à 349 jours. Il faut prouver l'index physique complet
              23/24/25, sans fill, sur les cinq zones et comparer aux archives.
        phase_gates: *all_phases_blocked
        blockers:
          - 543 à 545 heures sur 8760 restent absentes, surtout à 22:00–23:00 locales.
          - La rematérialisation PIT Saturn et la parité avec les archives ne sont pas prouvées.

      - id: load_wind_solar_quantiles_pit
        title: Quantiles PIT séparés charge, vent et solaire
        zones: [FR, DE, BE, NL, ES]
        phase: A
        status: blocked
        operational_source:
          provider: Saturn_or_verified_public_provider
          dataset: point_forecasts_load_wind_solar
          series_or_endpoint: exact_zone_series_unselected
        feature_contract:
          kind: probabilistic_numeric
          output_columns:
            - load_q10
            - load_q50
            - load_q90
            - wind_q10
            - wind_q50
            - wind_q90
            - solar_q10
            - solar_q50
            - solar_q90
            - renewable_tail_risk
          numeric_only: true
          uses_physical_actuals: true
          physical_actual_latest_day_offset: -2
          same_day_uncleared_price_allowed: false
        gates:
          availability_d_minus_1_0800:
            status: blocked
            evidence_refs: []
            note: Les séries exactes et leur heure de disponibilité ne sont pas gelées.
          point_in_time_vintages:
            status: blocked
            evidence_refs: []
            note: Aucun corpus complet de vintages par cycle n'est scellé.
          license_internal_research:
            status: blocked
            evidence_refs: []
            note: Les droits restent à vérifier par fournisseur et variable.
          causal_lineage:
            status: passed
            evidence_refs: [contract:physical_calibration_ends_d_minus_2]
            note: La transformation proposée impose la calibration physique jusqu'à D-2.
          numeric_schema:
            status: passed
            evidence_refs: [contract:separate_ordered_fundamental_quantiles]
            note: Sorties numériques et quantiles ordonnés pré-déclarés.
          zone_coverage:
            status: blocked
            evidence_refs: []
            note: Couverture non auditée sur les cinq zones.
        phase_gates: *all_phases_blocked
        blockers:
          - Sources, vintages, droits et couverture ne sont pas encore prouvés.

