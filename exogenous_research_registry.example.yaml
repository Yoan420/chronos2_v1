          numeric_only: true
          uses_physical_actuals: false
          physical_actual_latest_day_offset: null
          same_day_uncleared_price_allowed: false
        gates:
          availability_d_minus_1_0800:
            status: blocked
            evidence_refs: []
            note: Cycle, fin de publication et latence avant 08:00 non sélectionnés.
          point_in_time_vintages:
            status: blocked
            evidence_refs: []
            note: Les grilles brutes par cycle ne sont pas encore archivées immuablement.
          license_internal_research:
            status: blocked
            evidence_refs: []
            note: Licence et droits de stockage/redistribution à vérifier.
          causal_lineage:
            status: blocked
            evidence_refs: []
            note: La chaîne cycle-publication-extraction doit être auditée de bout en bout.
          numeric_schema:
            status: passed
            evidence_refs: [contract:raw_grids_aggregated_to_numeric_features]
            note: Seuls des agrégats numériques pourront entrer dans le modèle.
          zone_coverage:
            status: blocked
            evidence_refs: []
            note: Historique homogène et maillage des cinq zones non prouvés.
        phase_gates: *all_phases_blocked
        blockers:
          - Fournisseur, cycles, archive PIT, licence et couverture restent à choisir et prouver.

