        title: Agrégats NWP de zone et pays voisins
        zones: [FR, DE, BE, NL, ES]
        phase: A
        status: blocked
        operational_source:
          provider: unselected_archived_nwp_provider
          dataset: cycle_versioned_weather_grids
          series_or_endpoint: provider_cycle_endpoint_to_contract
        feature_contract:
          kind: nwp_numeric
          output_columns:
            - wind_speed_100m_zone
            - wind_direction_100m_zone
            - temperature_2m_zone
            - solar_irradiance_zone
            - cloud_cover_zone
