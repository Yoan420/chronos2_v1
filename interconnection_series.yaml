# Remplace les valeurs REPLACE_WITH_SATURN_SERIES par les identifiants
# exacts présents dans Saturn. Supprime les frontières non disponibles.
#
# Les séries sont injectées avec lag24 et lag168. Le run n'utilise donc pas
# de capacité ex post de J+1 et reste causal.

minimum_coverage: 0.50

series:
  - alias: fr_de_import_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: import
    description: Capacité disponible Allemagne vers France

  - alias: fr_de_export_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: export
    description: Capacité disponible France vers Allemagne

  - alias: fr_be_import_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: import
    description: Capacité disponible Belgique vers France

  - alias: fr_be_export_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: export
    description: Capacité disponible France vers Belgique

  - alias: fr_es_import_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: import
    description: Capacité disponible Espagne vers France

  - alias: fr_es_export_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: export
    description: Capacité disponible France vers Espagne

  - alias: fr_gb_import_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: import
    description: Capacité disponible Grande-Bretagne vers France

  - alias: fr_gb_export_capacity
    series: REPLACE_WITH_SATURN_SERIES
    direction: export
    description: Capacité disponible France vers Grande-Bretagne
