backtest:
  origin_hour: 0
  skip_irregular_local_days: false
  windows: 730
data:
  cache_dir: data/cache
  default_fill_limit: 0
  dynamic_delivery_day_horizon: true
  fail_below_minimum_coverage: true
  forecast_origin_local_time: 08:00
  frequency: h
  historical_years: 4
  minimum_future_coverage: 1.0
  pit_files:
    be_residual_load_fcst: be_residual_load_fcst.parquet
    de_residual_load_fcst: de_residual_load_fcst.parquet
    es_residual_load_fcst: es_residual_load_fcst.parquet
    fr_nuclear_generation_fcst: fr_nuclear_generation_fcst.parquet
    fr_residual_load_fcst: fr_residual_load_fcst.parquet
    nl_residual_load_fcst: nl_residual_load_fcst.parquet
  pit_vintage_dir: data/pit/vintages
  project_root: .
  quarter_hour_incomplete: raise
  require_all_covariates: true
  require_complete_future_covariates: true
  require_complete_target_day: true
  revision_policy: latest_before_asof
  runtime_as_of: '2026-08-11T12:00:00+02:00'
  saturn_author: BQ6757
  saturn_url: https://saturn-energyscan.gem.myengie.com//api
  source: auto
  target_end_policy: current_day_end
  target_input_resolution: hourly
  target_interpolation_limit: 0
hourly:
  catboost:
    backend: catboost
    depth: 7
    iterations: 501
    l2_leaf_reg: 6.0
    learning_rate: 0.035
    min_samples_per_hour: 1000000
    thread_count: -1
  data_quality:
    audit_feature_substrings:
    - residual_load
    - nuclear
    - net_export
    - firm_margin
    minimum_hourly_coverage: null
    warn_below_hourly_coverage: 0.9
  ensemble:
    minimum_rows: 720
    weight_l2: 1.0e-06
  feature_engineering:
    target_lags:
    - 24
    - 48
    - 168
    - 336
    target_rolling_windows:
    - 24
    - 72
    - 168
    timezone: Europe/Paris
  lear:
    alpha: 0.02
    l1_ratio: 0.8
    max_iter: 10000
    min_samples_per_hour: 60
  oof:
    ensemble_minimum_rows: 720
    evaluation_days: 365
    gap_days: 1
    min_train_days: 730
    n_splits: 5
  residual_correction:
    backend: catboost
    base_model: chronos2
    correction_scale: 1.0
    depth: 6
    enabled: true
    feature_builder:
      exclude_day_of_year: true
      exclude_historical_prices: true
      include_calendar: true
      include_daily_profiles: true
      include_rich_calendar: true
      rich_calendar_countries:
      - FR
      - DE
      - BE
      - ES
      - NL
      rich_calendar_primary_country: FR
      timezone: Europe/Paris
    iterations: 700
    l2_leaf_reg: 15.0
    learning_rate: 0.03
    max_abs_correction: 40.0
    min_samples_leaf: 30
    min_training_rows: 720
    random_state: 42
    thread_count: -1
    verbose: false
  supply_stack:
    columns:
      api2_usd_tonne: api2_usd_tonne
      coal_eur_mwh_th: null
      eua_eur_tco2: eua_eur_tco2
      eurusd_usd_per_eur: eurusd_usd_per_eur
      export_headroom: export_headroom
      hydro_firm: hydro_firm
      import_headroom: import_headroom
      load_forecast: load_forecast
      nuclear_available: nuclear_available
      nuclear_minimum: nuclear_minimum
      pumping_capacity: pumping_capacity
      run_of_river: run_of_river
      solar_forecast: solar_forecast
      thermal_available: thermal_available
      ttf_eur_mwh_th: ttf_eur_mwh_th
      wind_forecast: wind_forecast
    enabled: false
    nan_policy: raise
    rolling_windows:
    - 3
    - 6
    - 24
model:
  attn_implementation: auto
  context_length: 2048
  device: auto
  horizon: 24
  local_files_only: true
  model_batch_size: 128
  model_id: amazon/chronos-2
  origin_batch_size: 12
  seed: 42
output:
  directory: runs/chronos2_hourly_fr_residual_v1
report:
  baseline_model: ensemble
  enabled: true
  extreme_threshold: 150.0
  filename: chronos2_hourly_fr_residual_v1.html
  forecast_history_hours: 168
  native_model: residual_corrected
  title: "Chronos-2 horaire FR \u2014 correcteur r\xE9siduel v1"
zones:
  FR:
    covariates:
      be_residual_load_fcst:
        enabled: true
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.be.residual.load.hourly.gw.fcst
        source: pit_parquet
      de_residual_load_fcst:
        enabled: true
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.de.residual.load.hourly.gw.fcst
        source: pit_parquet
      es_residual_load_fcst:
        enabled: true
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.es.residual.load.hourly.gw.fcst
        source: pit_parquet
      fr_net_exports:
        enabled: false
        fill_limit: 2
        fill_method: ffill
        future:
          known_future: false
          strategies:
          - lag96
        include_base_context: false
        incomplete_dst_policy: duplicate
        minimum_coverage: 0.9
        series: power.net.fr.exports.core.entsoe.hourly.gw.obs
        source: auto
      fr_nuclear_generation_fcst:
        enabled: false
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.fr.generation.nuclear.remit.mw.fcst
        source: pit_parquet
      fr_nuclear_generation_obs:
        enabled: false
        fill_limit: 2
        fill_method: ffill
        future:
          known_future: false
          strategies:
          - lag96
        include_base_context: false
        incomplete_dst_policy: duplicate
        minimum_coverage: 0.9
        naive_timezone: Europe/Paris
        series: power.fr.generation.nuclear.entsoe.hourly.gw.obs
        source: auto
      fr_residual_load_fcst:
        enabled: true
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.fr.residual.load.hourly.gw.fcst
        source: pit_parquet
      nl_residual_load_fcst:
        enabled: true
        fill_method: none
        future:
          known_future: true
          strategies:
          - oracle
        minimum_coverage: 0.5
        series: power.nl.residual.load.hourly.gw.fcst
        source: pit_parquet
    enabled: true
    include_calendar: true
    target:
      description: Prix Day-Ahead France horaire ENTSO-E (timeline UTC)
      naive_timezone: UTC
      series: power.price.da.fr.bzn.hourly.entsoe.utc.cdh.eurmwh
    timezone: Europe/Paris
