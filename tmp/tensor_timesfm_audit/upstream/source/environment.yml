name: tensorts
channels:
  - nvidia
  - pytorch
  - pyg
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - einops
  - sympy
  - sentencepiece
  - bitsandbytes~=0.43.1
  - psutil
  - nvtop
  - tqdm
  - rich
  - attrs
  - tabulate
  - typing_extensions
  - absl-py
  - python-dotenv
  - ruamel.yaml
  - omegaconf
  - typed-argument-parser
  - hydra-core
  - hydra-submitit-launcher
  - jsonargparse
  - typeshed-client>=2.1.0
  - openpyxl
  - pandarallel
  - patool
  - sktime
  - torchinfo
  - pyg::pytorch-sparse~=0.6.18
  # PyTorch + CUDA runtime (single source of truth)
  - pytorch::pytorch
  - pytorch::pytorch-mutex=*=cuda
  - pytorch::pytorch-cuda=11.8
  # HF stack
  - conda-forge::transformers
  - conda-forge::datasets
  - conda-forge::accelerate
  - conda-forge::evaluate
  - conda-forge::tokenizers>=0.13.1
  - conda-forge::peft
  # Lightning (2.x only)
  - conda-forge::lightning~=2.2.5
  - conda-forge::torchmetrics
  - conda-forge::plotly
  # viz/dev
  - matplotlib
  - seaborn
  - moviepy
  - jupyter
  - wandb
  - tensorboardx
  - click
  - setuptools_scm
  - twine
  - blackd
  - mypy
  - bump2version
  - watchdog
  - flake8
  - tox
  - coverage
  - sphinx
  - nvidia::cuda-nvcc
  - pip:
      - build
      - datargs
      - sourcery
      - torchopt
      - torch_optimizer
      - separableconv-torch
      - cd2root
      - omegaconf-argparse
      - cookiecutter
      - reformer_pytorch
      - black
      - "black[jupyter]"
      # tip: install flash-attn later via pip if needed:
